[package]
name = "meshfs_dokan"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
description = "A port of Dokany 2.3.1's user-mode protocol (dokan2.dll) behind a versioned C ABI, used by MeshFS on Windows."
repository = "https://github.com/theShroo/meshfs-dokan"
publish = false

[lib]
name = "meshfs_dokan"
# The cdylib is meshfs_dokan.dll, the separate, replaceable LGPL library. The
# rlib only lets the tests and the example host share the ABI types.
crate-type = ["cdylib", "rlib"]

# Only the driver calls; everything else is plain Rust (design section 3.2).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Security",
] }

# The example host and the layout tests: struct layouts from the Windows SDK
# metadata, a security descriptor for the test volume, and LoadLibraryExW.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Wdk_System_SystemServices",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
overflow-checks = true
debug = 1
panic = "unwind"
